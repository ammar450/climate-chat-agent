services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server
      PORT: "8000"
      # SPARQL / Graph configuration (overrides .env if set)
      GRAPH_IRI: "climateobservations/eobs-v31"
      SPARQL_ENDPOINT: "https://obs.knowledgehub.nfdi4earth.de/sparql/"
    # Makes host.docker.internal resolve to the host machine on Linux too
    # (Docker Desktop on Windows/Mac does this automatically)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
